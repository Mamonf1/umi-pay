<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px; height: 1024px; overflow: hidden;
    background: radial-gradient(circle at 50% 42%, #0d0719 0%, #05030c 62%);
    display: grid; place-items: center;
  }
  .tile {
    width: 648px; height: 648px; border-radius: 28%;
    display: grid; place-items: center; position: relative;
    background: linear-gradient(135deg, #f5dfa0, #e8c766 55%, #c99b3f);
    box-shadow: 0 0 190px rgba(232,199,102,.42), inset 0 8px 0 rgba(255,255,255,.45), inset 0 -14px 34px rgba(120,80,10,.28);
    font-family: 'Cairo', sans-serif; font-weight: 900; color: #0a0416; font-size: 352px; line-height: 1;
  }
  .tile .gloss {
    position: absolute; inset: 34px; border-radius: 28%;
    background: linear-gradient(160deg, rgba(255,255,255,.38) 0%, transparent 42%);
  }
  .u { transform: translateY(-10px); }
  /* نسخة maskable: بلاطة أصغر داخل منطقة الأمان الدائرية */
  body.maskable .tile { width: 560px; height: 560px; font-size: 304px; }
</style>
</head>
<body>
  <div class="tile"><span class="gloss"></span><span class="u">U</span></div>
</body>
</html>
